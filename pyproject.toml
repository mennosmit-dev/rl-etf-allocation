[project]
name = "rl-etf-allocation"
version = "0.1.0"
description = "Reinforcement learning for weekly ETF allocation: data validation, PPO training, rolling retraining, model registry, serving and paper trading."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandera>=0.24",
    "pyarrow>=15",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch>=2.3",
    "mlflow>=2.14",
]

[project.optional-dependencies]
fetch = ["yfinance>=0.2.40"]

[project.scripts]
rl-etf = "rl_portfolio.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_portfolio"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
